<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Menu - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px 0;
    }
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 15px 15px 0 0 !important;
      padding: 20px;
    }
    .form-control, .form-select {
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      padding: 10px 15px;
      transition: all 0.3s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-danger {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      border-radius: 10px;
      padding: 10px 30px;
      font-weight: 600;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
    }
    .btn-secondary {
      border-radius: 10px;
      padding: 10px 20px;
    }
    .list-group-item {
      border: none;
      border-bottom: 1px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #f8f9fa;
      transition: all 0.3s;
    }
    .list-group-item:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    .alert {
      border-radius: 10px;
      border: none;
    }
    h3 {
      color: white;
      font-weight: 700;
      margin-bottom: 30px;
    }
    h5 {
      color: #333;
      font-weight: 600;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<div class="container mt-5 mb-5">
  <div class="card">
    <div class="card-header">
      <h3 class="mb-0">➕ Add Menu Item</h3>
    </div>
    <div class="card-body p-4">
      <div id="message" class="alert d-none" role="alert"></div>

      <form id="menuForm">
        <div class="mb-3">
          <label class="form-label fw-600">Menu Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter menu name" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-600">Price (₹)</label>
          <input type="number" id="price" class="form-control" placeholder="Enter price" step="0.01" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-600">Category</label>
          <select id="cid" class="form-select" title="select a category" required></select>
        </div>

        <button type="submit" class="btn btn-danger w-100">Add Menu</button>
      </form>

      <hr class="my-4">
      <h5>📋 Existing Menu</h5>
      <ul id="menuList" class="list-group mt-3"></ul>
    </div>
  </div>
  
  <div class="text-center mt-4">
    <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://ioxvbpthqdbodzrzoobk.supabase.co";
const supabaseKey = "sb_publishable_N7JaJC0pBOqyl7cqHh8TYw_9YixTH1u";

const supabase1 = supabase.createClient(supabaseUrl, supabaseKey);

async function loadCategories() {
  const { data, error } = await supabase1.from("categories").select("*").order("cid");
  const select = document.getElementById("cid");
  select.innerHTML = `<option value="">Select Category</option>`;
  if(error) return console.error(error);
  data.forEach(cat => {
    select.innerHTML += `<option value="${cat.cid}">${cat.cname}</option>`;
  });
}

async function loadMenu() {
  const { data, error } = await supabase1.from("menu").select("*").order("mid");
  const list = document.getElementById("menuList");
  list.innerHTML = "";
  if(error) return console.error(error);
  data.forEach(item => {
    const li = document.createElement("li");
    li.className = "list-group-item d-flex justify-content-between";
    li.innerHTML = `<span>${item.name}</span> <span class="fw-600">₹${item.price}</span>`;
    list.appendChild(li);
  });
}

document.getElementById("menuForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const price = parseFloat(document.getElementById("price").value);
  const cid = parseInt(document.getElementById("cid").value);

  if(!name || !price || !cid) return;

  const { error } = await supabase1.from("menu").insert([{ name, price, cid }]);
  const msg = document.getElementById("message");
  if(error){
    msg.className = "alert alert-danger";
    msg.textContent = "Error: " + error.message;
  } else {
    msg.className = "alert alert-success";
    msg.textContent = "Menu item added successfully!";
    document.getElementById("menuForm").reset();
    loadMenu();
  }
  msg.classList.remove("d-none");
});

loadCategories();
loadMenu();
</script>

</body>
</html>
