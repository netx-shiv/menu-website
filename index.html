<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REVA Food Corner - Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

   <style>
    body { background: #f7f7f7; }
    header { background: #d32f2f; color: #fff; padding: 20px; text-align: center; }
    .logo img { max-width: 180px; margin-bottom: 10px; }
    .category-btns button { border-radius: 20px; margin: 5px; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .price { color: #d32f2f; font-weight: bold; font-size: 18px; }
    footer { background: #222; color: #ccc; text-align: center; padding: 15px; margin-top: 40px; }
    .menu-item { transition: transform 0.3s; }
    .menu-item:hover { transform: scale(1.05); }
</style>
</head>
<body>

<header>
    <div class="logo">
        <img src="D:\menudemo1\WhatsApp Image 2026-01-09 at 4.33.40 PM.jpeg" alt="Logo">
    </div>
    <h1>REVA Food Corner</h1>
    <p>Welcome to our menu</p>
    <div class="mt-3">
        <button class="btn btn-light text-danger" onclick="showSection('menu')">Menu</button>
        <button class="btn btn-light text-danger" onclick="showSection('branch')">Branch</button>
    </div>
</header>

<div class="container my-4">
    <div id="categoryTabs" class="category-btns text-center mb-4"></div>
    <div id="menuSection" class="row g-4"></div>
    <div id="branchSection" class="row g-4 d-none"></div>
</div>

<footer>&copy; 2026 REVA Food Corner</footer>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- SUPABASE JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================= SUPABASE CONFIG ================= */
const supabaseUrl = "https://ioxvbpthqdbodzrzoobk.supabase.co";
const supabaseKey = "sb_publishable_N7JaJC0pBOqyl7cqHh8TYw_9YixTH1u";
const supabase1 = supabase.createClient(supabaseUrl, supabaseKey);

/* ================= DATA LOAD ================= */
let categoryData = [];
let menuData = [];

// Load categories
async function loadCategories() {
    const { data, error } = await supabase1.from('catagories').select('*');
    if (error) return console.error(error);
    categoryData = data;

    const categoryTabs = document.getElementById('categoryTabs');
    categoryTabs.innerHTML = `<button class="btn btn-danger" onclick="filterMenu('all')">All</button>`;
    data.forEach(cat => {
        categoryTabs.innerHTML += `<button class="btn btn-outline-danger" onclick="filterMenu(${cat.cid})">${cat.cname}</button>`;
    });
}

// Load menu
async function loadMenu(categoryId = null) {
    let query = supabase1.from('menu').select('*');
    if (categoryId) query = query.eq('cid', categoryId);

    const { data, error } = await query;
    if (error) return console.error(error);

    menuData = data;
    renderMenu(menuData);
}

// Render menu items
function renderMenu(items) {
    const menuSection = document.getElementById('menuSection');
    menuSection.innerHTML = "";
    items.forEach(item => {
        menuSection.innerHTML += `
            <div class="col-md-4 menu-item">
                <div class="card p-3 h-100">
                    <h5>${item.name}</h5>
                    <div class="price">₹${item.price}</div>
                </div>
            </div>
        `;
    });
}

// Filter menu
function filterMenu(categoryId) {
    if (categoryId === 'all') renderMenu(menuData);
    else renderMenu(menuData.filter(item => item.cid === categoryId));
}

// Load branches
async function loadBranches() {
    const { data, error } = await supabase1.from('branches').select('*');
    if (error) return console.error(error);

    const branchSection = document.getElementById('branchSection');
    branchSection.innerHTML = "";
    data.forEach(b => {
        branchSection.innerHTML += `
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>${b.bname}</h5>
                    <p>${b.address}</p>
                    <a href="${b.map_link}" target="_blank" class="text-danger fw-bold">📍 View on Map</a>
                </div>
            </div>
        `;
    });
}

// Show / hide sections
function showSection(section) {
    document.getElementById("menuSection").classList.add("d-none");
    document.getElementById("branchSection").classList.add("d-none");
    document.getElementById("categoryTabs").classList.add("d-none");

    if (section === "menu") {
        document.getElementById("menuSection").classList.remove("d-none");
        document.getElementById("categoryTabs").classList.remove("d-none");
    } else {
        document.getElementById("branchSection").classList.remove("d-none");
    }
}

// Initialize
async function init() {
    await loadCategories();
    await loadMenu();
    await loadBranches();
    showSection("menu");
}

init();
</script>

</body>
</html>
