<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CUSTOM CSS -->
    <style>
        body {
            background: #f4f6f8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .card-header {
            background: #dc3545;
            color: #fff;
            border-radius: 14px 14px 0 0;
            padding: 18px;
            text-align: center;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 12px;
        }

        .btn {
            border-radius: 10px;
            padding: 10px 18px;
        }

        .btn-primary {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-primary:hover {
            background-color: #c82333;
            border-color: #c82333;
        }

        .alert {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Edit Category</h4>
                </div>

                <div class="card-body p-4">

                    <!-- ALERT -->
                    <div id="alertBox"></div>

                    <form id="editCategoryForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category Name</label>
                            <input
                                type="text"
                                id="cname"
                                class="form-control"
                                placeholder="Enter category name"
                                required
                            >
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary w-100">
                                Update Category
                            </button>
                            <a href="view-categories.html" class="btn btn-outline-secondary w-100">
                                Back
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ===================== FAKE DATABASE ===================== */
let categories = [
    { cid: 1, cname: "Chocolate" },
    { cid: 2, cname: "Dry Fruits" },
    { cid: 3, cname: "American Thick Shake" }
];

/* ===================== GET CATEGORY ID ===================== */
const params = new URLSearchParams(window.location.search);
const cid = parseInt(params.get("cid"));

if (!cid) window.location.href = "view-categories.html";

/* ===================== LOAD CATEGORY ===================== */
const category = categories.find(c => c.cid === cid);
if (!category) window.location.href = "view-categories.html";

document.getElementById("cname").value = category.cname;

/* ===================== UPDATE ===================== */
document.getElementById("editCategoryForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const cname = document.getElementById("cname").value.trim();
    const alertBox = document.getElementById("alertBox");
    alertBox.innerHTML = "";

    if (!cname) {
        showAlert("Category name cannot be empty.", "danger");
        return;
    }

    const duplicate = categories.find(
        c => c.cname.toLowerCase() === cname.toLowerCase() && c.cid !== cid
    );

    if (duplicate) {
        showAlert("Category name already exists.", "danger");
        return;
    }

    category.cname = cname;
    showAlert("Category updated successfully!", "success");
});

/* ===================== ALERT ===================== */
function showAlert(message, type) {
    document.getElementById("alertBox").innerHTML = `
        <div class="alert alert-${type} mt-3">${message}</div>
    `;
}
</script>

</body>
</html>
