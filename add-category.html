<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Category - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h3>Add Category</h3>
  <div id="message" class="alert d-none"></div>

  <form id="categoryForm" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Category Name</label>
      <input type="text" id="cname" class="form-control" placeholder="Enter category name" required>
    </div>
    <button type="submit" class="btn btn-danger">Add Category</button>
  </form>

  <hr>
  <h5>Existing Categories</h5>
  <ul id="categoryList" class="list-group mt-2"></ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://ioxvbpthqdbodzrzoobk.supabase.co";
const supabaseKey = "sb_publishable_N7JaJC0pBOqyl7cqHh8TYw_9YixTH1u";

// ✅ Correct: use lowercase 'supabase'
const supabase1 = supabase.createClient(supabaseUrl, supabaseKey);

// Load existing categories
async function loadCategories() {
  const { data, error } = await supabase1.from("catagories").select("*").order("cid");
  const list = document.getElementById("categoryList");
  list.innerHTML = "";
  if(error) return console.error(error);
  data.forEach(cat => {
    const li = document.createElement("li");
    li.className = "list-group-item";
    li.textContent = cat.cname;
    list.appendChild(li);
  });
}

// Add category
document.getElementById("categoryForm").addEventListener("submit", async e => {
  e.preventDefault();
  const cname = document.getElementById("cname").value.trim();
  if(!cname) return;

  const { data, error } = await supabase1.from("catagories").insert([{ cname }]);
  const msg = document.getElementById("message");
  if(error){
    msg.className = "alert alert-danger";
    msg.textContent = "Error: " + error.message;
  } else {
    msg.className = "alert alert-success";
    msg.textContent = "Category added successfully!";
    document.getElementById("cname").value = "";
    loadCategories();
  }
});

// Initial load
loadCategories();
</script>

</body>
</html>
<style>
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px 0;
  }
  
  .container {
    background: white;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    padding: 30px;
    max-width: 600px;
  }
  
  h3 {
    color: #667eea;
    font-weight: 600;
    margin-bottom: 25px;
    border-bottom: 3px solid #667eea;
    padding-bottom: 10px;
  }
  
  h5 {
    color: #333;
    font-weight: 600;
    margin-top: 30px;
  }
  
  .form-label {
    font-weight: 500;
    color: #555;
  }
  
  .form-control {
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px 15px;
    transition: all 0.3s;
  }
  
  .form-control:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
  }
  
  .btn-danger {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 8px;
    padding: 10px 30px;
    font-weight: 500;
    transition: transform 0.2s;
  }
  
  .btn-danger:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
  }
  
  .list-group-item {
    border: none;
    border-bottom: 1px solid #f0f0f0;
    background: #f9f9f9;
    border-radius: 0;
  }
  
  .list-group-item:first-child {
    border-radius: 8px 8px 0 0;
  }
  
  .list-group-item:last-child {
    border-radius: 0 0 8px 8px;
    border-bottom: none;
  }
  
  .alert {
    border-radius: 8px;
    border: none;
    margin-bottom: 20px;
  }
</style>
