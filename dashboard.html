<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      max-width: 1000px;
    }

    .btn-outline-danger {
      font-weight: 600;
      border-width: 2px;
      transition: all 0.3s ease;
      padding: 12px 20px;
      border-radius: 8px;
    }

    .btn-outline-danger:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(220, 53, 69, 0.3);
    }

    h5 {
      color: #333;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<script>
  if(localStorage.getItem("adminLoggedIn") !== "true"){
    window.location.href = "admin-login.html";
  }
</script>

<nav class="navbar navbar-dark bg-danger px-3">
  <span class="navbar-brand">Admin Dashboard</span>
  <button type="button" onclick="logout()" class="btn btn-light btn-sm">Logout</button>
</nav>

<div class="container mt-5">
  <div class="row g-4">
    <div class="col-md-6 col-lg-3">
      <a href="add-category.html" class="btn btn-outline-danger w-100">➕ Add Category</a>
    </div>
    <div class="col-md-6 col-lg-3">
      <a href="add-menu.html" class="btn btn-outline-danger w-100">➕ Add Menu</a>
    </div>
    <div class="col-md-6 col-lg-3">
      <a href="view-categories.html" class="btn btn-outline-danger w-100">👁️ View Categories</a>
    </div>
    <div class="col-md-6 col-lg-3">
      <a href="view-menu.html" class="btn btn-outline-danger w-100">👁️ View Menu</a>
    </div>
  </div>
</div>

<script>
  function logout(){
    localStorage.removeItem("adminLoggedIn");
    window.location.href = "admin-login.html";
  }
</script>

</body>
</html>
